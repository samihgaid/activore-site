<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dropShine" x1="0.3" y1="0" x2="0.7" y2="0.5">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Rounded background -->
  <g clip-path="url(#roundRect)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Subtle radial glow behind droplet -->
    <circle cx="256" cy="270" r="180" fill="#3b82f6" opacity="0.07"/>
    <circle cx="256" cy="270" r="120" fill="#3b82f6" opacity="0.05"/>

    <!-- Sun element - peeking from top right -->
    <g filter="url(#sunGlow)">
      <circle cx="390" cy="115" r="42" fill="url(#sun)" opacity="0.9"/>
      <!-- Sun rays -->
      <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="390" y1="62" x2="390" y2="48"/>
        <line x1="390" y1="182" x2="390" y2="196"/>
        <line x1="337" y1="115" x2="323" y2="115"/>
        <line x1="443" y1="115" x2="457" y2="115"/>
        <line x1="352" y1="77" x2="342" y2="67"/>
        <line x1="428" y1="153" x2="438" y2="163"/>
        <line x1="352" y1="153" x2="342" y2="163"/>
        <line x1="428" y1="77" x2="438" y2="67"/>
      </g>
    </g>

    <!-- Main water droplet -->
    <g filter="url(#glow)">
      <path d="M256 108
               C256 108, 160 240, 160 310
               C160 363, 203 408, 256 408
               C309 408, 352 363, 352 310
               C352 240, 256 108, 256 108Z"
            fill="url(#drop)"/>
    </g>

    <!-- Droplet shine/highlight -->
    <path d="M256 130
             C256 130, 175 245, 175 310
             C175 355, 212 393, 256 393
             C300 393, 337 355, 337 310
             C337 245, 256 130, 256 130Z"
          fill="url(#dropShine)" opacity="0.3"/>

    <!-- Inner shine spot -->
    <ellipse cx="225" cy="280" rx="28" ry="40" fill="#ffffff" opacity="0.15" transform="rotate(-15, 225, 280)"/>

    <!-- Small activity dots at bottom of droplet -->
    <g opacity="0.95">
      <!-- Green dot - good conditions -->
      <circle cx="222" cy="355" r="10" fill="#22c55e"/>
      <!-- Yellow dot - caution -->
      <circle cx="256" cy="362" r="10" fill="#eab308"/>
      <!-- Red dot - danger -->
      <circle cx="290" cy="355" r="10" fill="#ef4444"/>
    </g>

    <!-- Subtle score lines inside droplet -->
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.2">
      <line x1="215" y1="310" x2="297" y2="310"/>
      <line x1="225" y1="325" x2="287" y2="325"/>
      <line x1="230" y1="340" x2="282" y2="340"/>
    </g>

  </g>
</svg>
